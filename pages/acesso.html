<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/assets/brand/logo.png" />
    <title>Acesso | Fa & Gu Eventos</title>
  </head>
  <body class="inner-page page-auth">
    <!-- site-header:voltar -->
    <main class="auth-main">
      <section class="auth-card">
        <p class="section-label">Área do cliente</p>
        <h1 id="auth-title">Entre na sua conta.</h1>
        <p class="auth-description">Acompanhe seus pedidos de orçamento e continue planejando seu momento.</p>
        <form id="auth-form" novalidate>
          <label id="name-field" hidden>Nome<input name="name" autocomplete="name" /></label>
          <label>E-mail<input name="email" type="email" autocomplete="email" required /></label>
          <label>Senha<input name="password" type="password" autocomplete="current-password" minlength="8" required /></label>
          <button class="page-button" type="submit" id="auth-submit">Entrar <span>↗</span></button>
          <p id="auth-feedback" class="auth-feedback" role="status" aria-live="polite"></p>
        </form>
        <button class="auth-switch" type="button" id="auth-switch">Ainda não tenho uma conta</button>
        <div id="account-panel" hidden>
          <p>Olá, <strong id="account-name"></strong>.</p>
          <h2>Meus orçamentos</h2>
          <ul id="quote-list" class="quote-list"></ul>
          <button class="auth-switch" type="button" id="logout-button">Sair da conta</button>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.js?v=20261013-auth"></script>
  </body>
</html>
